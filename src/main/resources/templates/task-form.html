<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Form</title>
</head>
<body>
<h1>Task Form</h1>

<form th:action="@{/task/save}" th:object="${taskModel}" method="post">
    <input type="hidden" th:field="*{id}">

    <div>
        <label for="name">Name</label>
        <input id="name" type="text" th:field="*{name}" placeholder="Name">
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}">Name Error</span>
    </div>

    <div>
        <label for="description">Description</label>
        <textarea id="description"
                  th:field="*{description}"
                  placeholder="Description"></textarea>
        <span th:if="${#fields.hasErrors('description')}"
              th:errors="*{description}">Description Error</span>
    </div>

    <div>
        <label for="dueDate">Due date</label>
        <input id="dueDate" type="date" th:field="*{dueDate}">
        <span th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">Invalid date</span>
    </div>

    <div>
        <label for="completed">Completed</label>
        <input id="completed" type="checkbox" th:field="*{completed}">
    </div>

    <button type="submit">Save</button>
    <a th:href="@{/tasks}">Cancel</a>
</form>
</body>
</html>
