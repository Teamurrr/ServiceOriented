<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
</head>
<body>

<h1>Task List</h1>

<p>
    <a th:href="@{/task/new}">Add Task</a>
</p>

<form th:action="@{/tasks/filter}" method="get">
    <label for="completed">Filter:</label>

    <select id="completed" name="completed">
        <option value="false">Pending</option>
        <option value="true">Completed</option>
    </select>

    <button type="submit">Filter</button>
    <a th:href="@{/tasks}">Show All</a>
</form>

<h2>Filter by due date</h2>

<form th:action="@{/tasks/filter/date}" method="get">
    <div>
        <label for="startDate">Start date:</label>
        <input
                id="startDate"
                name="startDate"
                type="date"
                th:value="${startDate}"
                required>
    </div>

    <div>
        <label for="endDate">End date:</label>
        <input
                id="endDate"
                name="endDate"
                type="date"
                th:value="${endDate}"
                required>
    </div>

    <button type="submit">Filter by date</button>
</form>пше

<hr>

<div th:each="task : ${tasks}">
    <p>
        <strong>Name:</strong>
        <span th:text="${task.name}">Task Name</span>
    </p>

    <p>
        <strong>Description:</strong>
        <span th:text="${task.description}">Task Description</span>
    </p>

    <p>
        <strong>Due date:</strong>
        <span th:text="${task.dueDate}">Due Date</span>
    </p>

    <p>
        <strong>Status:</strong>
        <span th:text="${task.completed ? 'Completed' : 'Pending'}">
            Status
        </span>
    </p>

    <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>
    <form th:action="@{/tasks/delete/{id}(id=${task.id})}"
          method="post"
          style="display: inline;">
        <button type="submit">Delete</button>
    </form>

    <hr>
</div>

</body>
</html>
